<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a0f08">
  <title>РТ-одежда — Админка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <!-- Tailwind как каркас утилит -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Дизайн-система магазина -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#1a0f08] text-[#f0e6d6] font-sans">

  <header class="sticky top-0 z-10" style="background:var(--bg-alt);border-bottom:1px solid var(--border)">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-xl">РТ-одежда — Админка</h1>
      <a href="/" class="admin-link">← На сайт</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 space-y-10">

    <!-- Добавление товара -->
    <section>
      <h2 class="sec-title">Добавить товар</h2>
      <form id="add-product-form" class="p-6 grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="product-title" class="field-label">Название *</label>
          <input type="text" id="product-title" required placeholder="Например: Платье">
        </div>
        <div>
          <label for="product-price" class="field-label">Цена (₽) *</label>
          <input type="number" id="product-price" required min="0" step="1" placeholder="Например: 2500">
        </div>
        <div>
          <label for="product-image" class="field-label">URL картинки</label>
          <input type="url" id="product-image" placeholder="https://...">
        </div>
        <div>
          <label for="product-description" class="field-label">Описание</label>
          <input type="text" id="product-description" placeholder="Короткое описание товара">
        </div>
        <div class="sm:col-span-2">
          <button type="submit" class="btn btn--gold">
            Добавить товар
          </button>
          <p id="product-form-msg" class="hidden mt-3 text-sm font-medium"></p>
        </div>
      </form>
    </section>

    <!-- Товары -->
    <section>
      <h2 class="sec-title">Товары</h2>
      <div class="bg-white rounded-xl shadow-sm overflow-x-auto">
        <table class="w-full text-sm min-w-[640px]">
          <thead>
            <tr>
              <th class="px-4 py-3">ID</th>
              <th class="px-4 py-3">Название</th>
              <th class="px-4 py-3">Цена</th>
              <th class="px-4 py-3">Действия</th>
            </tr>
          </thead>
          <tbody id="products-body"></tbody>
        </table>
      </div>
      <p id="products-empty" class="hidden text-gray-500 text-center py-10">Товаров пока нет</p>
    </section>

    <!-- Заказы -->
    <section>
      <h2 class="sec-title">Заказы</h2>
      <div class="bg-white rounded-xl shadow-sm overflow-x-auto">
        <table class="w-full text-sm min-w-[640px]">
          <thead>
            <tr>
              <th class="px-4 py-3">ID</th>
              <th class="px-4 py-3">Имя</th>
              <th class="px-4 py-3">Товары</th>
              <th class="px-4 py-3">Сумма</th>
              <th class="px-4 py-3">Дата</th>
            </tr>
          </thead>
          <tbody id="orders-body"></tbody>
        </table>
      </div>
      <p id="empty-msg" class="hidden text-gray-500 text-center py-10">Заказов пока нет</p>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
